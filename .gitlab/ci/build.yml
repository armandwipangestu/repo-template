# =============================================================================
# Build
# Mirrors: .github/workflows/pr-build.yml (build-and-test job)
# =============================================================================

build:
  stage: build
  image: oven/bun:1.2.23-alpine
  <<: *default_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - bun install --frozen-lockfile
  script:
    - bun run build
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 hour

build-semantic-release-dry-run:
  stage: build
  image: node:25-alpine
  <<: *default_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - npm install
  script:
    - npx semantic-release --dry-run --branches=$CI_COMMIT_BRANCH
  variables:
    GITLAB_TOKEN: "false"
    DEBUG: "semantic-release:*"
  allow_failure: true
